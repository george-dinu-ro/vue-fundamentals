<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <div v-bind:style="{backgroundColor: 'aqua', fontSize: customFontSize + 'px'}">First header</div>
    </div>
</body>
<script>
    const { createApp } = Vue;

    const customFontSize = 60;

    createApp({
        setup() {
            return { customFontSize }
        }
    }).mount("#app");

</script>

</html>
