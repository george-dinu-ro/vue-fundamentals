<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <h1>{{message}}</h1>
        <p>My name is {{person.name}}</p>
        <p>My details: {{person}}</p>
        <p>My random number in range [1, 10] : {{getRandomNumber()}}</p>
        <p>My lucky numbers: {{luckyNumbers}}</p>
    </div>
</body>
<script>
    const { createApp } = Vue;

    createApp({
        setup() {
            const message = "Hello world";

            const luckyNumbers = [11, 22, 33];

            function getRandomNumber() {
                return Math.floor(Math.random() * 10) + 1;
            }

            const person = {
                name: "John J.",
                age: 30,
                country: "USA"
            };

            return { message, getRandomNumber, luckyNumbers, person }
        }
    }).mount("#app");

</script>

</html>
