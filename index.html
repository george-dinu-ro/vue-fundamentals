<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <h1>{{message}}</h1>
        <p>I am {{person.name}} {{person.age}} years old</p>
        <p>My favorite numbers</p>
        <ul>
            <li v-for="favoriteNumber in favoriteNumbers">{{favoriteNumber}}</li>
        </ul>
    </div>
</body>
<script>
    const { createApp, ref, reactive } = Vue;

    createApp({
        setup() {
            const message = "Hello world";

            const favoriteNumbers = [1, 11, 22, 33, 44, 55];

            const person = reactive({
                name: "John J.",
                age: 30,
                country: "USA",
                salary: 20000,
                hasCorporateCard: true,
                spendingLimit: 10000,
                yearsInCompany: 5
            });

            return { message, favoriteNumbers, person }
        }
    }).mount("#app");

</script>

</html>
