<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <div v-bind:style="{backgroundColor: 'aqua', fontSize: customFontSize + 'px'}">First header</div>
        <br>
        <br>
        <span class="padding-medium" v-bind:class="{h1:isTitle(), 'bg-green':hasGreenBackground()}">Hello again</span>
        <br>
        <br>
        <span class="padding-medium" v-bind:class="isTitle() ? title : ''">Hello again</span>
    </div>
</body>
<script>
    const { createApp } = Vue;

    const customFontSize = 60;

    const title = {
        h1: true,
        'bg-grey': true
    };

    createApp({
        setup() {

            function isTitle() {
                return true;
            }

            function hasGreenBackground() {
                return true;
            }

            return { customFontSize, isTitle, hasGreenBackground, title }
        }
    }).mount("#app");

</script>
<style>
    .h1 {
        font-size: 40px;
        color: brown;
    }

    .h2 {
        font-size: 20px;
        color: blueviolet;
    }

    .bg-grey {
        background-color: grey;
    }

    .bg-green {
        background-color: green;
    }

    .padding-medium {
        padding: 20px;
    }
</style>

</html>
