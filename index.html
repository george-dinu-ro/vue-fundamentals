<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <h1 v-html="getMessage()"></h1>
        <p>I am {{person.name}} {{person.age}} years old</p>
        <p>Random updating number: {{randomNumber}}</p>
        <p v-once>Random fixed number: {{randomNumber}}</p>
        <p><a target="_blank" v-bind:href="googleUrl">Google</a></p>
        {{setRandomNumber()}}
    </div>
</body>
<script>
    const { createApp, ref, reactive } = Vue;

    createApp({
        setup() {
            const message = "Hello world</h1>";

            const googleUrl = "https://www.google.com";

            let randomNumber = ref(5);

            const person = reactive({
                name: "John J.",
                age: 30,
                country: "USA"
            });

            function getMessage() {
                return `<h1><u>${message}</u></h1>`;
            }

            function setRandomNumber() {
                setTimeout(() => {
                    person.age = 31;
                    randomNumber.value = Math.floor(Math.random() * 100) + 1;
                }, 2000);
            }

            return { randomNumber, getMessage, setRandomNumber, person, googleUrl }
        }
    }).mount("#app");

</script>

</html>
