<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <h1>{{getMessage()}}</h1>
        <p>I am {{person.name}} {{person.age}} years old</p>
        <p>My lucky number: {{myLuckyNumber}}</p>
        {{setRandomNumber()}}
    </div>
</body>
<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            const message = "Hello world";

            let myLuckyNumber = ref(5);

            function getMessage() {
                return message.toUpperCase();
            }

            function setRandomNumber() {
                setTimeout(() => {
                    person.value.age = 31;
                    myLuckyNumber.value = Math.floor(Math.random() * 100) + 1;
                }, 2000);
            }

            const person = ref({
                name: "John J.",
                age: 30,
                country: "USA"
            });

            return { myLuckyNumber, getMessage, setRandomNumber, person }
        }
    }).mount("#app");

</script>

</html>
