<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <h1>{{message}}</h1>
        <p>I am {{person.name}} {{person.age}} years old</p>
        <p v-show="person.hasCorporateCard">Card spending limit: {{person.spendingLimit}}</p>
    </div>
</body>
<script>
    const { createApp, ref, reactive } = Vue;

    createApp({
        setup() {
            const message = "Hello world";

            const person = reactive({
                name: "John J.",
                age: 30,
                country: "USA",
                salary: "***",
                hasCorporateCard: true,
                spendingLimit: 10000,
                yearsInCompany: 5
            });

            return { message, person }
        }
    }).mount("#app");

</script>

</html>
