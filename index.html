<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <h1>{{message}}</h1>
        <p>{{question}}</p>
    </div>
</body>
<script>
    const { createApp } = Vue;

    createApp({
        setup() {
            const message = "Hello world";
            const question = "How are you?";

            return { message, question }
        }
    }).mount("#app");

</script>

</html>
